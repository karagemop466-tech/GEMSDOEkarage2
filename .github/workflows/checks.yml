name: Evidence checks
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: python scripts/assess_release.py
      - run: python scripts/audit_k2_release.py
      - run: python scripts/audit_public_downloads.py --check
      - run: python scripts/review_hk3_protocol.py --check
      - run: python scripts/build_site.py
      - run: python scripts/build_hk3_pages.py --check
      - run: python scripts/build_hunmap_pages.py --check
      - run: python scripts/audit_submission_candidate.py --check
      - run: git diff --exit-code -- docs evidence
      - run: pytest -q
      - run: python -m compileall -q scripts vendor
