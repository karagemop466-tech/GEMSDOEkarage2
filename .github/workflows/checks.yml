name: Evidence checks
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: python scripts/assess_release.py
      - run: python scripts/audit_k2_release.py
      - run: python scripts/audit_public_downloads.py --check
      - run: python scripts/review_hk3_protocol.py --check
      - name: Verify generated files are current
        run: |
          snapshot() { find docs evidence -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum; }
          before="$(snapshot)"
          python scripts/build_site.py
          after="$(snapshot)"
          if [ "$before" != "$after" ]; then
            echo "Generated docs/evidence changed during build; regenerate and commit the outputs."
            exit 1
          fi
      - run: pytest -q
      - run: python -m compileall -q scripts vendor
