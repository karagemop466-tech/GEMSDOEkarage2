name: Tests and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish the same relative structure as the legacy main-root source;
      # docs pages link to the root research/ and README.md files.
      - name: Prepare published site
        run: |
          mkdir -p .pages
          cp -R docs research .pages/
          cp index.html README.md .pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - uses: actions/deploy-pages@v4
        id: deployment
