name: Publish research desk
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/assess_release.py
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- docs
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:site
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public source status (failure is shown explicitly)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_feed.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Pages is currently configured for legacy main-root builds. Publish the
      # same root -> docs/ layout so those builds cannot invalidate URLs when
      # they race the scheduled Actions deployment. Do not publish .git/caches.
      - name: Stage stable Pages layout
        run: |
          mkdir -p "$RUNNER_TEMP/gems-pages/docs"
          cp index.html "$RUNNER_TEMP/gems-pages/index.html"
          cp -a docs/. "$RUNNER_TEMP/gems-pages/docs/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gems-pages
      - id: deployment
        uses: actions/deploy-pages@v4
