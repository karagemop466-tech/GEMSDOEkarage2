name: Publish research desk
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/assess_release.py
      - run: python scripts/build_site.py
      - run: python scripts/build_field_notes.py
      - run: git diff --exit-code -- docs
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:site
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh GitHub source status (not DrivenData)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/refresh_feed.py --github-only
          python scripts/refresh_sources.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
