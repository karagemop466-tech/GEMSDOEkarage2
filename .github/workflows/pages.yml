name: Publish research desk
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public source status (failure is shown explicitly)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
